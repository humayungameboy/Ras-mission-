name: Build RAS Mission APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify Android project
        shell: bash
        run: |
          cat \
            project_chunks/project.b64.part00 \
            project_chunks/project.b64.part01 \
            project_chunks/project.b64.part02 \
            project_fix2/r00 \
            project_fix2/r01 \
            project_fix2/r02 \
            project_fix2/r03 \
            project_fix2/r04 \
            project_fix2/r05 \
            project_fix2/r06 \
            project_fix2/r07 \
            project_chunks/project.b64.part05 \
            | tr -d '\n\r' | base64 -d > project.zip
          echo "8c57394ecccd88e3559666e65c62f8485b69c83c906341da2498e0a96ab554a4  project.zip" | sha256sum -c -
          unzip -q project.zip
          test -f RAS_Mission_Android_V3/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RAS Mission V3 APK
        working-directory: RAS_Mission_Android_V3
        run: gradle --no-daemon assembleDebug

      - name: Prepare installable APK
        run: cp RAS_Mission_Android_V3/app/build/outputs/apk/debug/app-debug.apk RAS_Mission_V3.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RAS_Mission_V3_APK
          path: RAS_Mission_V3.apk
          if-no-files-found: error
          retention-days: 30
